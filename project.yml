# Generate the Xcode project with: xcodegen generate
name: CoverflexBudget

options:
  bundleIdPrefix: com.gmcabrita
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  CoverflexCore:
    path: Packages/CoverflexCore

settings:
  base:
    DEVELOPMENT_TEAM: 5JCZ9B7BDM
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  CoverflexBudget:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: CoverflexCore
      - target: CoverflexBudgetWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gmcabrita.CoverflexBudget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: App/CoverflexBudget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gmcabrita.CoverflexBudget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Coverflex Budget
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Must match AppLink.scheme in CoverflexCore.
        CFBundleURLTypes:
          - CFBundleURLName: com.gmcabrita.CoverflexBudget
            CFBundleURLSchemes:
              - coverflexbudget

  CoverflexBudgetWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    dependencies:
      - package: CoverflexCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gmcabrita.CoverflexBudget.Widget
    entitlements:
      path: Widget/CoverflexBudgetWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gmcabrita.CoverflexBudget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Coverflex Budget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # Inter 4.1, SIL Open Font License (Widget/Fonts/Inter-LICENSE.txt).
        UIAppFonts:
          - InterVariable.ttf
