# Generate the Xcode project with: xcodegen generate
#
# To build with another Apple developer account, set these environment variables before
# `xcodegen generate`:
#   IOS_DEVELOPMENT_TEAM   team ID (default 5JCZ9B7BDM)
#   IOS_BUNDLE_ID_PREFIX   prefix of the bundle IDs and the App Group (default com.gmcabrita)
#
# How the defaults work: XcodeGen replaces `${VAR}` only when VAR is set. When it is not set,
# `${VAR}` stays in the project, Xcode reads it as a reference to the build setting VAR, and the
# build setting with the same name below holds the default.
name: CoverflexBudget

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  CoverflexCore:
    path: Packages/CoverflexCore

settings:
  base:
    IOS_DEVELOPMENT_TEAM: 5JCZ9B7BDM
    IOS_BUNDLE_ID_PREFIX: com.gmcabrita
    DEVELOPMENT_TEAM: ${IOS_DEVELOPMENT_TEAM}
    BUNDLE_ID_PREFIX: ${IOS_BUNDLE_ID_PREFIX}
    # Shared by the app and the widget. The Swift code reads it from CoverflexAppGroup in Info.plist.
    APP_GROUP_IDENTIFIER: group.$(BUNDLE_ID_PREFIX).CoverflexBudget
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  CoverflexBudget:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: CoverflexCore
      - target: CoverflexBudgetWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CoverflexBudget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: App/CoverflexBudget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Coverflex Budget
        CoverflexAppGroup: $(APP_GROUP_IDENTIFIER)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Must match AppLink.scheme in CoverflexCore.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - coverflexbudget

  CoverflexBudgetWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    dependencies:
      - package: CoverflexCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CoverflexBudget.Widget
    entitlements:
      path: Widget/CoverflexBudgetWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Coverflex Budget
        CoverflexAppGroup: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # Inter 4.1, SIL Open Font License (Widget/Fonts/Inter-LICENSE.txt).
        UIAppFonts:
          - InterVariable.ttf
